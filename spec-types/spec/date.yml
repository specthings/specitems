spec-info:
  str:
    assert:
    - re: '^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])(T([01][0-9]|2[0-3]):([0-5][0-9]):([0-5][0-9])(Z|(\+|-)([01][0-9]|2[0-3]):([0-5][0-9]))?)?\Z'
    description: |
      It shall be a date in the ISO 8601 format.  A capital T separates an
      optional time from the date.  A Z or an offset such as ``+08:00`` gives
      the time zone of the time.
spec-name: Date
