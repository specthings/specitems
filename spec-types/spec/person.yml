spec-info:
  dict:
    attributes:
      first-name:
        description: |
          If the attribute is present, then its value shall be the first names
          of the person, otherwise the person has only the name.
        spec-type: str
      name:
        description: |
          It shall be the last name of the person, a role, or a pseudonym. The
          documents refer to the person by the first names and this name.
        spec-type: str
    description: |
      This set of attributes specifies a person. Items such as inspections,
      documents and references refer to the person item, so that the data of
      the person is stated at one place. A change of the item, for example a
      rectification or a pseudonymisation, reaches each document which the
      build produces again. The item contains only the name, since the
      documents need nothing more. The UID of the item shall not contain the
      name, so that a pseudonymisation reaches each link to the item.
    mandatory-attributes:
    - name
spec-name: Person Item Type
spec-type: person
type: spec
