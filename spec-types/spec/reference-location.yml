spec-info:
  dict:
    attributes:
      anchor:
        description: |
          It shall be the anchor of the area within the page of the referenced
          work.  The anchor is the fragment of the URL without the number
          sign.  An example is the identifier of a section heading.  The
          anchor replaces the anchor which the label yields.
        spec-type: str
      label:
        description: |
          It shall be the label to the area within the referenced work.  The
          label format is specific to the referenced work.  An example is a
          label to a document location.
        spec-type: str
      location:
        description: |
          It shall be the location of the area within the referenced work.  An
          example is a section number.
        spec-type: str
      name:
        description: |
          It shall be the name of the area within the referenced work.  An
          example is the name of a chapter or a section.
        spec-type: str
      path:
        description: |
          It shall be the path to the component of the area within the
          referenced work.  The path format is specific to the referenced
          work.  An example is the path to a page or a part of resource
          locator.
        spec-type: str
    description: |
      This set of attributes specifies an area within a referenced work.  The
      item shall have exactly one link with the reference-location role to the
      referenced work.  Items may link to a reference location with the
      reference role.
    mandatory-attributes: none
spec-name: Reference Location
spec-type: reference-location
type: spec
