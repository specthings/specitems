spec-info:
  dict:
    attributes:
      author:
        description: |
          If the attribute is present, then its value shall be the author or
          the list of authors of the article. The reference contributor links
          with the field `author` take precedence over the value.
        spec-type: str-or-list-str
      booktitle:
        description: |
          It shall be the title of the conference proceedings.
        spec-type: str
      doi:
        description: |
          It shall be the digital object identifier (DOI) of the article.
        spec-type: str
      editor:
        description: |
          If the attribute is present, then its value shall be the editor or
          the list of editors of the article. The reference contributor links
          with the field `editor` take precedence over the value.
        spec-type: str-or-list-str
      month:
        description: |
          It shall be the month of publication.
        spec-type: month
      note:
        description: |
          It shall be associated miscellaneous information.
        spec-type: str
      number:
        description: |
          It shall be the issue number of the conference proceedings.
        spec-type: str
      organization:
        description: |
          If the attribute is present, then its value shall be the associated
          organization. The reference contributor links with the field
          `organization` take precedence over the value.
        spec-type: str
      pages:
        description: |
          It shall be the page numbers, separated either by commas or double-hyphens.
        spec-type: str
      publisher:
        description: |
          If the attribute is present, then its value shall be the name of the
          publisher. The reference contributor links with the field `publisher`
          take precedence over the value.
        spec-type: str
      series:
        description: |
          It shall be the series of the conference proceedings the article was published.
        spec-type: str
      volume:
        description: |
          It shall be the volume of the conference proceedings.
        spec-type: str
      year:
        description: |
          It shall be the year of publication.
        spec-type: str
    description: |
      This set of attributes specifies a reference to an article in a conference
      proceedings.
    mandatory-attributes:
    - booktitle
    - year
spec-name: In Conference Proceedings Reference
spec-type: reference-inproceedings
type: spec
